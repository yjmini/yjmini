<svg width="350" height="170" viewBox="0 0 350 170" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Most Used Languages</title>
  <desc id="desc">Top languages for yjmini after excluding notebook-heavy learning repositories and using size/count balanced weighting.</desc>
  <style>
    .header { font: 600 18px 'Segoe UI', Ubuntu, Sans-Serif; fill: #70a5fd; }
    .lang-name { font: 400 11px 'Segoe UI', Ubuntu, Sans-Serif; fill: #38bdae; }
  </style>
  <rect x="0.5" y="0.5" rx="4.5" height="169" width="349" fill="#0d1117" stroke="#E4E2E2" stroke-opacity="0" />
  <text x="25" y="35" class="header">Most Used Languages</text>
  <clipPath id="bar-clip"><rect x="25" y="55" width="300" height="8" rx="5" /></clipPath>
  <g clip-path="url(#bar-clip)">
    <rect x="25.00" y="55" width="151.87" height="8" fill="#3572A5" /><rect x="176.87" y="55" width="60.48" height="8" fill="#f34b7d" /><rect x="237.36" y="55" width="40.66" height="8" fill="#b07219" /><rect x="278.02" y="55" width="24.65" height="8" fill="#DA5B0B" /><rect x="302.67" y="55" width="22.33" height="8" fill="#41b883" />
  </g>
  <circle cx="30" cy="84" r="5" fill="#3572A5" /><text x="41" y="88" class="lang-name" text-anchor="start">Python 50.62%</text><circle cx="30" cy="102" r="5" fill="#f34b7d" /><text x="41" y="106" class="lang-name" text-anchor="start">C++ 20.16%</text><circle cx="30" cy="120" r="5" fill="#b07219" /><text x="41" y="124" class="lang-name" text-anchor="start">Java 13.55%</text><circle cx="30" cy="138" r="5" fill="#DA5B0B" /><text x="41" y="142" class="lang-name" text-anchor="start">Jupyter Notebook 8.22%</text><circle cx="30" cy="156" r="5" fill="#41b883" /><text x="41" y="160" class="lang-name" text-anchor="start">Vue 7.44%</text>
</svg>
