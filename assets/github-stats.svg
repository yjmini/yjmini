<svg width="420" height="190" viewBox="0 0 420 190" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">GitHub Stats</title>
  <desc id="desc">Static GitHub statistics for yjmini</desc>
  <style>
    .card { fill: #0d1117; stroke: #30363d; stroke-width: 1; }
    .title { fill: #58a6ff; font: 700 18px 'Segoe UI', Ubuntu, Sans-Serif; }
    .label { fill: #8b949e; font: 500 12px 'Segoe UI', Ubuntu, Sans-Serif; }
    .value { fill: #c9d1d9; font: 700 18px 'Segoe UI', Ubuntu, Sans-Serif; }
    .accent { fill: #50e3c2; }
  </style>
  <rect class="card" x="0.5" y="0.5" width="419" height="189" rx="12" />
  <text x="24" y="36" class="title">YJMINI GitHub Stats</text>
  <circle cx="386" cy="30" r="6" class="accent" opacity="0.9" />
  <text x="34" y="82" class="label">Public Repos</text><text x="34" y="102" class="value">25</text>
  <text x="235" y="82" class="label">Stars</text><text x="235" y="102" class="value">0</text>
  <text x="34" y="122" class="label">Forks</text><text x="34" y="142" class="value">1</text>
  <text x="235" y="122" class="label">Contributions</text><text x="235" y="142" class="value">646</text>
  <text x="34" y="162" class="label">Followers</text><text x="34" y="182" class="value">5</text>
  <text x="235" y="162" class="label">Data Source</text><text x="235" y="182" class="value">GitHub API</text>
</svg>
