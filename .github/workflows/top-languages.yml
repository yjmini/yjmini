name: Update top languages card

on:
  schedule:
    - cron: "15 0 * * *"
  workflow_dispatch:
  push:
    paths:
      - "scripts/generate_top_languages.py"
      - ".github/workflows/top-languages.yml"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Generate top languages SVG
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/generate_top_languages.py

      - name: Commit updated SVG if changed
        run: |
          if git diff --quiet -- assets/top-languages.svg; then
            echo "No top language card changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/top-languages.svg
          git commit -m "chore: update top languages card"
          git push
